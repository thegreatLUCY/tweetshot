<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TweetShot composer harness</title>
<link rel="stylesheet" href="/lib/editor-ui.css">
<style>
  body { margin: 0; font-family: system-ui; background: #15202b; color: #e7e9ea; }
  form { max-width: 520px; margin: 40px auto; border: 1px solid #2f3336; border-radius: 12px; padding: 16px; }
  [data-testid="tweetTextarea_0"] { min-height: 80px; border: 1px dashed #3e4144; border-radius: 8px; padding: 8px; }
  [data-testid="toolBar"] { display: flex; align-items: center; margin-top: 12px; }
  #media { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
  #media img { width: 180px; border-radius: 10px; display: block; }
  #log { position: fixed; right: 8px; bottom: 8px; width: 460px; max-height: 40vh; overflow: auto;
         background: #0a0d12; border: 1px solid #2f3336; font: 11px/1.5 ui-monospace, monospace; padding: 8px; border-radius: 8px; }
</style>
</head>
<body>
<form role="dialog" aria-label="Compose">
  <div data-testid="tweetTextarea_0" contenteditable="true"></div>
  <div data-testid="toolBar"><button type="button">Media</button></div>
  <div id="media"></div>
  <input data-testid="fileInput" type="file" accept="image/*" multiple hidden>
</form>
<div id="log"></div>

<script>
  window.__errors = [];
  window.addEventListener('error', (e) => window.__errors.push(String(e.message)));
  window.addEventListener('unhandledrejection', (e) => window.__errors.push('rejection: ' + String(e.reason)));
  const log = (m) => { document.getElementById('log').textContent += m + '\n'; };
  window.__log = log;

  // stop the real OS file picker from opening; tests drive the input directly
  window.__lastPicker = null;
  HTMLInputElement.prototype.click = function () {
    if (this.type === 'file' && !this.dataset.testid) {
      window.__lastPicker = this;
      log('picker opened (intercepted)');
    } else {
      HTMLElement.prototype.click.call(this);
    }
  };
</script>

<script src="/lib/editor-core.js"></script>
<script src="/lib/editor-ui.js"></script>
<script src="/content/content.js"></script>

<script>
  // Minimal stand-in for X's composer: an accepted attach renders a preview.
  // Registered on DOMContentLoaded so content.js's capture listener is first —
  // that way an intercepted native attach really is blocked, while an injected
  // change (marked with data-txe-own) flows through.
  document.addEventListener('DOMContentLoaded', () => {
    const addPreviews = (files) => {
      const media = document.getElementById('media');
      [...(files || [])].forEach((f) => {
        if (!f.type.startsWith('image/')) return;
        const img = document.createElement('img');
        img.src = URL.createObjectURL(f);
        media.appendChild(img);
      });
    };
    document.addEventListener('change', (e) => {
      if (e.target.matches('input[data-testid="fileInput"]')) addPreviews(e.target.files);
    }, true);
    document.addEventListener('paste', (e) => {
      const files = e.clipboardData && e.clipboardData.files;
      if (files && files.length) { e.preventDefault(); addPreviews(files); }
    }, true);
  });
  window.__previewCount = () => document.querySelectorAll('#media img').length;
</script>
</body>
</html>
