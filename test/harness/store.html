<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TweetShot — store screenshot stage</title>
<link rel="stylesheet" href="/lib/editor-ui.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #000; color: #e7e9ea;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; justify-content: center;
  }
  .app { width: 1140px; padding: 0 16px; }
  .head { display: flex; align-items: center; justify-content: space-between; height: 56px; }
  .close { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; font-size: 18px; }
  .post {
    background: #1d9bf0; color: #fff; border: 0; border-radius: 999px;
    padding: 9px 18px; font-size: 15px; font-weight: 700;
  }
  .composer { display: flex; gap: 12px; padding: 4px 0 12px; }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%; flex: none;
    background: linear-gradient(150deg, #7c5cff, #1d9bf0 65%, #37b3ad);
  }
  .body { flex: 1; min-width: 0; }
  .draft { font-size: 19px; line-height: 1.5; padding: 6px 0 10px; outline: none; }
  .draft .muted { color: #71767b; }
  #media { display: flex; flex-direction: column; gap: 8px; }
  #media .media-item { position: relative; }
  #media img {
    width: 100%; max-height: 560px; object-fit: contain; display: block; background: #16181c;
    border: 1px solid #2f3336; border-radius: 16px;
  }
  .media-remove {
    position: absolute; top: 10px; left: 10px; width: 30px; height: 30px;
    border-radius: 50%; border: 0; cursor: pointer; font-size: 13px;
    background: rgba(0,0,0,.7); color: #fff; backdrop-filter: blur(4px);
  }
  .toolbar { display: flex; align-items: center; gap: 2px; margin-top: 14px; padding-top: 12px; border-top: 1px solid #2f3336; }
  .tool { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; color: #1d9bf0; }
  .tool svg { width: 19px; height: 19px; }
  .spacer { flex: 1; }
</style>
</head>
<body>
<div class="app">
  <div class="head">
    <div class="close">✕</div>
    <button class="post" type="button">Post</button>
  </div>

  <section class="composer" role="dialog" aria-label="Compose">
    <div class="avatar"></div>
    <div class="body">
      <div data-testid="tweetTextarea_0" contenteditable="true" class="draft">Golden hour in Lisbon <span class="muted">✨</span></div>
      <div id="media"></div>
      <div data-testid="toolBar" class="toolbar">
        <span class="tool"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><circle cx="9" cy="10" r="1.8"/><path d="M4 17l4.5-4.5 4 4L16 13l4 4"/></svg></span>
        <span class="tool"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M8 10h8M8 14h5"/></svg></span>
        <span class="tool"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"/><path d="M8 12h8M12 8v8"/></svg></span>
        <span class="tool"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"/><path d="M9 10h.01M15 10h.01M8.6 14.4a4.4 4.4 0 0 0 6.8 0"/></svg></span>
        <span class="spacer"></span>
      </div>
    </div>
  </section>
</div>

<!-- X hoists this outside the composer in the real app -->
<input data-testid="fileInput" type="file" accept="image/*" multiple hidden>

<script>
  window.__errors = [];
  window.addEventListener('error', (e) => window.__errors.push(String(e.message)));
  window.addEventListener('unhandledrejection', (e) => window.__errors.push('rejection: ' + String(e.reason)));
  window.__shotImage = new URLSearchParams(location.search).get('img') || '/test/harness/shot-source.png';

  // suppress the OS file dialog when tests drive the picker directly
  window.__lastPicker = null;
  HTMLInputElement.prototype.click = function () {
    if (this.type === 'file' && !this.dataset.testid) window.__lastPicker = this;
    else HTMLElement.prototype.click.call(this);
  };
</script>

<script src="/lib/editor-core.js"></script>
<script src="/lib/editor-ui.js"></script>
<script src="/content/content.js"></script>

<script>
  // accepted attaches render a preview, like the real composer
  document.addEventListener('DOMContentLoaded', () => {
    const add = (files) => {
      const media = document.getElementById('media');
      [...(files || [])].forEach((f) => {
        if (!f.type.startsWith('image/')) return;
        const item = document.createElement('div');
        item.className = 'media-item';
        const img = document.createElement('img');
        img.src = URL.createObjectURL(f);
        const rm = document.createElement('button');
        rm.type = 'button';
        rm.className = 'media-remove';
        rm.setAttribute('aria-label', 'Remove media');
        rm.textContent = '✕';
        rm.addEventListener('click', () => item.remove());
        item.append(img, rm);
        media.appendChild(item);
      });
    };
    document.addEventListener('change', (e) => {
      if (e.target.matches('input[data-testid="fileInput"]')) add(e.target.files);
    }, true);
    document.addEventListener('paste', (e) => {
      const files = e.clipboardData && e.clipboardData.files;
      if (files && files.length) { e.preventDefault(); add(files); }
    }, true);
  });
</script>
</body>
</html>
